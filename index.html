<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A free, no-signup habit tracker with a GitHub-style streak history." />
    <title>Habit Tracker</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>"
    />
    <script>
      // Apply the saved theme before React loads so a dark-mode user
      // never sees a flash of the light theme on refresh.
      try {
        var saved = JSON.parse(localStorage.getItem('habit-tracker:theme'));
        var dark =
          saved === 'dark' ||
          (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        /* storage blocked: React will fall back to the light theme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
